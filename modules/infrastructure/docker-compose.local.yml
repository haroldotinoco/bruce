version: '3.8'

services:
  # ──────────────────────────────────────────────────────────────
  # PostgreSQL 16 — Core application database
  # ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bruceai-postgres
    environment:
      POSTGRES_USER: bruceai
      POSTGRES_PASSWORD: bruceai
      POSTGRES_DB: bruceai
      POSTGRES_INITDB_ARGS: >-
        --locale=en_US.UTF-8
        --lc-collate=en_US.UTF-8
        --lc-ctype=en_US.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bruceai -d bruceai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bruceai-network

  # ──────────────────────────────────────────────────────────────
  # pgAdmin — PostgreSQL web UI (optional, for DB inspection)
  # ──────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bruceai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_COOKIE_DEFAULT_SECURE: "False"
      PGADMIN_CONFIG_COOKIE_SAMESITE: "Lax"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: "1"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bruceai-network

  # ──────────────────────────────────────────────────────────────
  # Redis 7 — Session cache and rate limiting
  # ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bruceai-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bruceai-network

  # ──────────────────────────────────────────────────────────────
  # Temporal Server — Orchestration engine (PostgreSQL persistence)
  # ──────────────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:latest
    container_name: bruceai-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: bruceai
      POSTGRES_PWD: bruceai
      DB_PORT: "5432"
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      BIND_ON_IP: "0.0.0.0"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "7233:7233"  # gRPC
      - "7234:7234"  # metrics
      - "7235:7235"  # membership
    healthcheck:
      test: ["CMD-SHELL", "tctl --address localhost:7233 cluster health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - bruceai-network

  # ──────────────────────────────────────────────────────────────
  # Temporal UI — Web dashboard
  # ──────────────────────────────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:latest
    container_name: bruceai-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"
    networks:
      - bruceai-network

  # ──────────────────────────────────────────────────────────────
  # Qdrant — Vector database for semantic search
  # ──────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bruceai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT_API_KEY: ""
      QDRANT_READ_ONLY: "false"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "cat </dev/null >/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bruceai-network

  # ──────────────────────────────────────────────────────────────
  # MinIO — S3-compatible object storage (R2 replacement)
  # ──────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: bruceai-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"     # API
      - "9001:9001"     # Console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bruceai-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  qdrant-data:
    driver: local
  minio-data:
    driver: local

networks:
  bruceai-network:
    driver: bridge
