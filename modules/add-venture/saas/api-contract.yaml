openapi: "3.0.3"
info:
  title: AddVenture API
  version: "1.0.0"
  description: AI-powered venture structuring — 8-volume dossier from a single opportunity brief
  contact:
    name: BruceAI Support
    url: https://bruceai.com/support
  license:
    name: Proprietary

servers:
  - url: https://api.addventure.bruceai.com/v1
    description: Production
  - url: https://staging-api.addventure.bruceai.com/v1
    description: Staging

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  /dossiers:
    post:
      summary: Submit a venture brief to generate a complete dossier
      operationId: createDossier
      tags:
        - Dossiers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - brief
              properties:
                brief:
                  type: object
                  required:
                    - problem_statement
                    - market_segment
                  properties:
                    problem_statement:
                      type: string
                      minLength: 50
                      description: The core problem being solved
                    market_segment:
                      type: string
                      description: Primary market or vertical
                    target_geography:
                      type: string
                      default: global
                      description: Geographic focus
                    founder_context:
                      type: string
                      description: Optional founder background and constraints
                    tam_estimate_usd:
                      type: integer
                      minimum: 0
                      description: Total Addressable Market estimate
                    additional_context:
                      type: string
                      description: Any supplementary information
                options:
                  type: object
                  properties:
                    business_model_preference:
                      type: string
                      enum:
                        - b2b
                        - b2c
                        - b2b2c
                        - marketplace
                        - any
                      default: any
                      description: Preferred business model
                    include_volumes:
                      type: array
                      items:
                        type: integer
                        minimum: 1
                        maximum: 8
                      description: Generate only specific volumes (default all 8)
                    language:
                      type: string
                      default: en
                      description: Output language
                webhook_url:
                  type: string
                  format: uri
                  description: URL for job completion webhook
      responses:
        "202":
          description: Dossier job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DossierJob"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Plan limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "429":
          description: Rate limited

    get:
      summary: List all dossiers
      operationId: listDossiers
      tags:
        - Dossiers
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - queued
              - running
              - completed
              - failed
          description: Filter by status
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Results per page
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination cursor
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DossierJob"
                  next_cursor:
                    type: string
                    nullable: true
        "401":
          description: Unauthorized

  /dossiers/{dossier_id}:
    get:
      summary: Get dossier status and metadata
      operationId: getDossier
      tags:
        - Dossiers
      parameters:
        - name: dossier_id
          in: path
          required: true
          schema:
            type: string
          description: Unique dossier identifier
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DossierResult"
        "404":
          description: Dossier not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /dossiers/{dossier_id}/volumes/{volume_number}:
    get:
      summary: Get a specific volume from a completed dossier
      operationId: getDossierVolume
      tags:
        - Dossiers
      parameters:
        - name: dossier_id
          in: path
          required: true
          schema:
            type: string
        - name: volume_number
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 8
          description: Volume number (1-8)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DossierVolume"
        "404":
          description: Volume not found or not yet completed
        "402":
          description: Volume not included in current plan

  /dossiers/{dossier_id}/download:
    get:
      summary: Download complete dossier as PDF or JSON
      operationId: downloadDossier
      tags:
        - Dossiers
      parameters:
        - name: dossier_id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum:
              - pdf
              - json
            default: json
          description: Download format
      responses:
        "200":
          description: Signed download URL (expires in 1 hour)
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url:
                    type: string
                    format: uri
                    description: Signed S3/R2 URL
                  expires_at:
                    type: string
                    format: date-time
                  format:
                    type: string
        "404":
          description: Dossier not found or not yet completed
        "402":
          description: Format not available on current plan

  /dossiers/{dossier_id}/iterate:
    post:
      summary: Request iteration on specific volumes
      operationId: iterateDossier
      tags:
        - Dossiers
      parameters:
        - name: dossier_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                volumes_to_redo:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                    maximum: 8
                  minItems: 1
                  description: Which volumes to regenerate
                feedback:
                  type: string
                  description: Guidance for the iteration
      responses:
        "202":
          description: Iteration job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DossierJob"
        "402":
          description: Iteration requires Pro plan or limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Dossier not found

  /usage:
    get:
      summary: Usage against plan limits
      operationId: getUsage
      tags:
        - Account
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"
        "401":
          description: Unauthorized

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk JWT token
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service-to-service auth

  schemas:
    DossierJob:
      type: object
      required:
        - id
        - status
        - progress_percent
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique dossier ID
        status:
          type: string
          enum:
            - queued
            - running
            - completed
            - failed
          description: Current job status
        current_volume:
          type: integer
          nullable: true
          minimum: 1
          maximum: 8
          description: Volume currently being generated
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Overall progress
        critique_score:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          description: Quality score (only if critique enabled)
        created_at:
          type: string
          format: date-time
        estimated_completion_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        error_message:
          type: string
          nullable: true
          description: Failure reason if status is failed

    DossierVolume:
      type: object
      required:
        - volume_number
        - title
        - content
      properties:
        volume_number:
          type: integer
          minimum: 1
          maximum: 8
        title:
          type: string
        content:
          type: object
          additionalProperties: true
          description: Volume-specific content structure
        confidence_score:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
        generated_at:
          type: string
          format: date-time

    DossierResult:
      allOf:
        - $ref: "#/components/schemas/DossierJob"
        - type: object
          properties:
            brief_summary:
              type: string
            volumes_completed:
              type: array
              items:
                type: integer
              description: List of completed volume numbers
            download_url:
              type: string
              nullable: true
              format: uri
            iteration_count:
              type: integer
              default: 0

    UsageSummary:
      type: object
      required:
        - plan
        - dossiers_used
        - dossiers_limit
      properties:
        plan:
          type: string
          enum:
            - free
            - pro
            - enterprise
        dossiers_used:
          type: integer
        dossiers_limit:
          type: integer
          description: -1 means unlimited
        iterations_used:
          type: integer
        iterations_limit:
          type: integer
          description: -1 means unlimited
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        reset_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable message
        details:
          type: object
          nullable: true
          additionalProperties: true
