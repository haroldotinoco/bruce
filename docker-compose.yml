services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bruce_dev
      POSTGRES_USER: bruce
      POSTGRES_PASSWORD: bruce_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # libpq defaults the DB name to the username when omitted; use bruce_dev (POSTGRES_DB).
      test: ["CMD-SHELL", "pg_isready -U bruce -d bruce_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:6333/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.21.5
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: bruce
      POSTGRES_PWD: bruce_dev_password
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
      - "7234:7234"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.20.0
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TLS_ENABLED: "false"
    depends_on:
      - temporal

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: bruce
    volumes:
      - minio_data:/minio
    command: server /minio --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
