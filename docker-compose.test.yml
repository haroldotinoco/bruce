# Test infrastructure (Phase 9). Start before integration tests:
#   docker compose -f docker-compose.test.yml up -d
services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bruce
      POSTGRES_PASSWORD: test
      POSTGRES_DB: bruce_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bruce -d bruce_test']
      interval: 5s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  temporal_test:
    image: temporalio/auto-setup:1.21.5
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: bruce
      POSTGRES_PWD: test
      POSTGRES_SEEDS: postgres_test
      POSTGRES_HOST: postgres_test
    ports:
      - '7235:7233'
      - '7236:7234'
    depends_on:
      postgres_test:
        condition: service_healthy
